name: Build NEXORA Client

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout core bindings
        uses: actions/checkout@v4
        with:
          repository: ArasTey/AndroidLibXrayLite
          ref: 33f200abc13762b5c79a11597f2273fdef1d21e7
          path: core-bindings

      - name: Checkout xray-core source
        uses: actions/checkout@v4
        with:
          repository: ArasTey/xray-core
          ref: aras-core-26.10.22
          path: xray-core-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        run: |
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/clt.zip
          unzip -q /tmp/clt.zip -d $SDK/cmdline-tools
          mv $SDK/cmdline-tools/cmdline-tools $SDK/cmdline-tools/latest
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Download geo assets
        run: |
          cd core-bindings
          curl -sL https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geoip.dat -o assets/geoip.dat
          curl -sL https://github.com/Chocolate4U/Iran-v2ray-rules/releases/latest/download/geosite.dat -o assets/geosite.dat

      - name: Build core AAR
        run: |
          cd core-bindings
          go mod edit -replace=github.com/xtls/xray-core=../xray-core-src
          go mod edit -dropreplace=github.com/patterniha/xray-core 2>/dev/null || true
          go mod tidy
          gomobile bind -androidapi 24 -trimpath \
            -ldflags='-s -w -buildid= -checklinkname=0' \
            -o $GITHUB_WORKSPACE/aras-core.aar ./

      - name: Verify core contents
        run: |
          set -euo pipefail
          rm -rf /tmp/aarcheck
          mkdir -p /tmp/aarcheck
          cd /tmp/aarcheck
          unzip -o -q "$GITHUB_WORKSPACE/aras-core.aar" "jni/arm64-v8a/libgojni.so"
          SO=jni/arm64-v8a/libgojni.so

          count() { strings "$SO" | grep -ci "$1" || true; }

          anytls=$(count anytls)
          amnezia=$(count amneziawg)
          stockwg=$(count 'golang.zx2c4.com/wireguard')

          echo "anytls=$anytls amneziawg=$amnezia stock-wireguard=$stockwg"

          fail=0
          [ "$anytls" -gt 0 ] || { echo "::error::AnyTLS missing"; fail=1; }
          [ "$amnezia" -gt 0 ] || { echo "::error::AmneziaWG missing"; fail=1; }
          [ "$stockwg" -eq 0 ] || { echo "::error::Stock WireGuard linked"; fail=1; }

          exit $fail

      - name: Upload core AAR
        uses: actions/upload-artifact@v4
        with:
          name: aras-core-aar
          path: aras-core.aar

  build-app:
    runs-on: ubuntu-latest
    needs: build-core

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Download core AAR
        uses: actions/download-artifact@v4
        with:
          name: aras-core-aar
          path: artifact-core

      - name: Place AAR into app libs
        run: |
          mkdir -p app/libs
          cp artifact-core/aras-core.aar app/libs/aras-core.aar

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-CLIENT
          path: app/build/outputs/apk/debug/*.apk
